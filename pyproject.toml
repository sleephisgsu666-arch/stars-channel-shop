[project]
name = "stars-channel-shop"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
 "aiogram==3.26.0", "fastapi==0.135.1", "uvicorn==0.41.0",
 "SQLAlchemy[asyncio]==2.0.48", "asyncpg==0.31.0", "alembic==1.18.4",
 "redis==7.3.0", "pydantic-settings==2.13.1", "httpx==0.28.1"
]
[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.6"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
